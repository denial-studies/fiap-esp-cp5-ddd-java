server:
  port: 8080

spring:
  application:
    name: fiap-bank-core-bancario
  datasource:
    url: jdbc:h2:mem:corebancariodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
